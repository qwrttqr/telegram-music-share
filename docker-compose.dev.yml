services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app
    ports:
      - "80:80"

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  bot:
    build:
      target: dev
    volumes:
      - ./bot:/app

  postgres:
    ports:
      - "5432:5432" 
