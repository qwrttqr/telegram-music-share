services:
  nginx:
    volumes:
      - ./docker/nginx/default.dev.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      APP_HOST: ${APP_HOST:-localhost}

  backend:
    build:
      target: dev
    volumes:
      - ./backend:/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_APP_URL=${APP_ORIGIN:-http://localhost:5173}

  bot:
    build:
      target: dev
    volumes:
      - ./bot:/app

  postgres:
    ports:
      - "5432:5432" 
